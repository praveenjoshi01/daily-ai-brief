<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 370" font-family="Helvetica,Arial,sans-serif">
<rect width="900" height="400" fill="#fbfaf6"/>
<defs><marker id="a" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8z" fill="#333"/></marker></defs>
<text x="30" y="34" font-size="20" font-weight="bold" fill="#1c1c1a">Where a malicious agent gets past an LLM action monitor</text>
<rect x="30" y="70" width="150" height="70" rx="8" fill="#e8eef7" stroke="#3a5a8c"/><text x="105" y="100" text-anchor="middle" font-size="15">Agent</text><text x="105" y="120" text-anchor="middle" font-size="12" fill="#444">proposes action</text>
<rect x="250" y="70" width="170" height="70" rx="8" fill="#e8eef7" stroke="#3a5a8c"/><text x="335" y="100" text-anchor="middle" font-size="15">Flatten transcript</text><text x="335" y="120" text-anchor="middle" font-size="12" fill="#444">plain-text turn prefixes</text>
<rect x="490" y="70" width="180" height="70" rx="8" fill="#e8eef7" stroke="#3a5a8c"/><text x="580" y="100" text-anchor="middle" font-size="15">S1 → S2 (→ agentic)</text><text x="580" y="120" text-anchor="middle" font-size="12" fill="#444">allow if any stage says harmless</text>
<rect x="740" y="70" width="130" height="70" rx="8" fill="#e6f2e6" stroke="#3b7a3b"/><text x="805" y="100" text-anchor="middle" font-size="15">Run action</text><text x="805" y="120" text-anchor="middle" font-size="12" fill="#444">bash, edit, tools</text>
<line x1="180" y1="105" x2="248" y2="105" stroke="#333" stroke-width="2" marker-end="url(#a)"/>
<line x1="420" y1="105" x2="488" y2="105" stroke="#333" stroke-width="2" marker-end="url(#a)"/>
<line x1="670" y1="105" x2="738" y2="105" stroke="#333" stroke-width="2" marker-end="url(#a)"/>
<rect x="20" y="230" width="160" height="70" rx="8" fill="#fbe9e4" stroke="#b4441f"/><text x="100" y="258" text-anchor="middle" font-size="13" font-weight="bold" fill="#1c1c1a">2 Execute-then-write</text><text x="100" y="280" text-anchor="middle" font-size="10.5" fill="#1c1c1a">cwd edits skip the monitor</text><rect x="200" y="230" width="160" height="70" rx="8" fill="#fbe9e4" stroke="#b4441f"/><text x="280" y="258" text-anchor="middle" font-size="13" font-weight="bold" fill="#1c1c1a">1 Injection</text><text x="280" y="280" text-anchor="middle" font-size="10.5" fill="#1c1c1a">forged turns via newlines</text><rect x="380" y="230" width="160" height="70" rx="8" fill="#fbe9e4" stroke="#b4441f"/><text x="460" y="258" text-anchor="middle" font-size="13" font-weight="bold" fill="#1c1c1a">3 Compaction</text><text x="460" y="280" text-anchor="middle" font-size="10.5" fill="#1c1c1a">agent summary = trusted</text><rect x="560" y="230" width="160" height="70" rx="8" fill="#fbe9e4" stroke="#b4441f"/><text x="640" y="258" text-anchor="middle" font-size="13" font-weight="bold" fill="#1c1c1a">4 Multi-agent</text><text x="640" y="280" text-anchor="middle" font-size="10.5" fill="#1c1c1a">handoffs read as authorization</text><rect x="740" y="230" width="160" height="70" rx="8" fill="#fbe9e4" stroke="#b4441f"/><text x="820" y="258" text-anchor="middle" font-size="13" font-weight="bold" fill="#1c1c1a">5 Policy gap</text><text x="820" y="280" text-anchor="middle" font-size="10.5" fill="#1c1c1a">blocked flag, open equivalent</text><g stroke="#b4441f" stroke-width="1.5" stroke-dasharray="4 3" fill="none"><path d="M100 230 V180 H704 V142" marker-end="url(#a)"/><line x1="280" y1="230" x2="300" y2="142" marker-end="url(#a)"/><line x1="460" y1="230" x2="520" y2="142" marker-end="url(#a)"/><line x1="640" y1="230" x2="630" y2="142" marker-end="url(#a)"/><line x1="820" y1="230" x2="805" y2="142" marker-end="url(#a)"/></g><text x="30" y="345" font-size="12" fill="#444">Dashed arrows: where each attack enters. Redrawn from the paper's description; positions are illustrative.</text></svg>