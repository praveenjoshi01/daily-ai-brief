<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 470" width="960" height="470" font-family="Helvetica,Arial,sans-serif">
<rect width="960" height="470" fill="#fbfaf7"/>
<text x="30" y="36" font-size="20" font-weight="700" fill="#1c1c1a">Where the learning lives: the Eko loop, redrawn</text>
<defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#5d5c57"/></marker></defs>
<g font-size="14" fill="#1c1c1a" stroke-width="2">
<rect x="30" y="80" width="190" height="80" rx="8" fill="#fff" stroke="#8a8a82"/><text x="125" y="112" text-anchor="middle" font-weight="700">Coding agent (LLM)</text><text x="125" y="134" text-anchor="middle">weights never change</text>
<rect x="290" y="80" width="190" height="80" rx="8" fill="#fff" stroke="#8a8a82"/><text x="385" y="112" text-anchor="middle" font-weight="700">Code + HTTP calls</text><text x="385" y="134" text-anchor="middle">chain many actions</text>
<rect x="550" y="80" width="190" height="80" rx="8" fill="#fff" stroke="#8a8a82"/><text x="645" y="112" text-anchor="middle" font-weight="700">Body in island world</text><text x="645" y="134" text-anchor="middle">Move, Pick, Throw, Jump...</text>
<rect x="550" y="250" width="190" height="70" rx="8" fill="#fff" stroke="#8a8a82"/><text x="645" y="280" text-anchor="middle" font-weight="700">Observe</text><text x="645" y="300" text-anchor="middle">positions and geometry</text>
<rect x="30" y="250" width="190" height="70" rx="8" fill="#fde9e1" stroke="#b4441f"/><text x="125" y="280" text-anchor="middle" font-weight="700">Memory files</text><text x="125" y="300" text-anchor="middle">persona / episodic / semantic</text>
<rect x="290" y="380" width="450" height="50" rx="8" fill="#fff" stroke="#b4441f" stroke-dasharray="6 4"/><text x="515" y="410" text-anchor="middle">Added: verified findings written down, kept in a persistent workspace</text>
</g>
<g stroke="#5d5c57" stroke-width="2" fill="none" marker-end="url(#a)">
<path d="M220 120 H290"/><path d="M480 120 H550"/><path d="M645 160 V250"/><path d="M550 285 H480 Q385 285 385 200 V165" /><path d="M125 250 V165"/><path d="M290 125 Q125 220 125 250" stroke-dasharray="5 4"/>
</g>
<text x="30" y="455" font-size="12" fill="#5d5c57">Redrawn from the project site's description. The highlighted memory loop is the part that carries learning across 30 hours.</text>
</svg>
