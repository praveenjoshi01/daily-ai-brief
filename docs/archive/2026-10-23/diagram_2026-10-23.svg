<svg xmlns="http://www.w3.org/2000/svg" width="900" height="470" viewBox="0 0 900 470" font-family="Helvetica,Arial,sans-serif" font-size="15">
<rect width="900" height="470" fill="#fbfaf7"/>
<text x="450" y="30" text-anchor="middle" font-size="19" font-weight="700" fill="#1c1c1a">Agent4Sci run: one 12-hour loop, three skills, two outside judges</text>
<defs><marker id="a" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8z" fill="#1c1c1a"/></marker></defs>
<rect x="20" y="70" width="130" height="70" rx="8" fill="#fff" stroke="#1c1c1a"/><text x="85" y="100" text-anchor="middle" font-weight="700">Benchmark</text><text x="85" y="120" text-anchor="middle" font-size="13">train + val only</text>
<rect x="190" y="70" width="170" height="70" rx="8" fill="#d9ead3" stroke="#2f6b2a" stroke-width="2"/><text x="275" y="97" text-anchor="middle" font-weight="700">Skill 1: ideation</text><text x="275" y="116" text-anchor="middle" font-size="13">literature mining, plan with</text><text x="275" y="131" text-anchor="middle" font-size="13">ambitious vs safe ideas</text>
<rect x="400" y="60" width="270" height="260" rx="10" fill="#fff" stroke="#1c1c1a" stroke-width="2"/><text x="535" y="85" text-anchor="middle" font-weight="700">Hill-climbing agent (8 H200s, 12 h)</text>
<rect x="420" y="100" width="230" height="60" rx="8" fill="#d9ead3" stroke="#2f6b2a" stroke-width="2"/><text x="535" y="125" text-anchor="middle" font-weight="700">Skill 2: experiment mgmt</text><text x="535" y="145" text-anchor="middle" font-size="13">keep GPUs busy, no contention</text>
<rect x="420" y="180" width="230" height="50" rx="8" fill="#f4f1e8" stroke="#1c1c1a"/><text x="535" y="210" text-anchor="middle">edit code, train, log, repeat</text>
<rect x="420" y="250" width="230" height="55" rx="8" fill="#d9ead3" stroke="#2f6b2a" stroke-width="2" stroke-dasharray="6 4"/><text x="535" y="274" text-anchor="middle" font-weight="700">Skill 3: hourly checklist</text><text x="535" y="293" text-anchor="middle" font-size="13">"am I just tuning?" (hook)</text>
<path d="M150,105 H188" stroke="#1c1c1a" stroke-width="2" marker-end="url(#a)"/><path d="M360,105 H398" stroke="#1c1c1a" stroke-width="2" marker-end="url(#a)"/>
<path d="M535,160 V178" stroke="#1c1c1a" stroke-width="2" marker-end="url(#a)"/><path d="M535,230 V248" stroke="#1c1c1a" stroke-width="2" marker-end="url(#a)"/>
<path d="M650,278 H660 V130 H652" fill="none" stroke="#2f6b2a" stroke-width="2" marker-end="url(#a)"/><text x="563" y="172" font-size="11" fill="#2f6b2a" text-anchor="middle" display="none">loop</text>
<rect x="730" y="70" width="150" height="80" rx="8" fill="#f3d9cf" stroke="#b4441f" stroke-width="2"/><text x="805" y="98" text-anchor="middle" font-weight="700">Evaluator agent</text><text x="805" y="118" text-anchor="middle" font-size="13">scores artifact on the</text><text x="805" y="133" text-anchor="middle" font-size="13">sequestered test set</text>
<rect x="730" y="190" width="150" height="80" rx="8" fill="#f3d9cf" stroke="#b4441f" stroke-width="2"/><text x="805" y="218" text-anchor="middle" font-weight="700">Auditor agent</text><text x="805" y="238" text-anchor="middle" font-size="13">reads the trajectory for</text><text x="805" y="253" text-anchor="middle" font-size="13">gaming / misconduct</text>
<path d="M670,100 H728" stroke="#1c1c1a" stroke-width="2" marker-end="url(#a)"/><path d="M670,230 H728" stroke="#1c1c1a" stroke-width="2" marker-end="url(#a)"/>
<text x="450" y="365" text-anchor="middle" font-size="14">Score = (hill-climb score - reproduced baseline) / |baseline|, signed so positive is better</text>
<rect x="20" y="410" width="14" height="14" fill="#d9ead3" stroke="#2f6b2a"/><text x="42" y="422" font-size="13">plug-in skill (markdown)</text>
<rect x="230" y="410" width="14" height="14" fill="#f3d9cf" stroke="#b4441f"/><text x="252" y="422" font-size="13">separate judge: the hill-climber never sees the test set</text>
</svg>
