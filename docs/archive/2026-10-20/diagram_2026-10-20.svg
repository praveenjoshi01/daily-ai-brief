<rect width="960" height="440" fill="#f6f5f1"/>
<text x="30" y="34" font-size="19" font-weight="700" fill="#1c1c1a">Harness²: two loops around a frozen model (my simplified redraw)</text>
<text x="30" y="56" font-size="12" fill="#5d5c57">Top row: task-level Propose, Probe, Compose. Bottom row (orange): the cross-task loop that stores lessons.</text>
<rect x="30" y="80" width="150" height="76" rx="8" fill="#ffffff" stroke="#1c1c1a" stroke-width="1.8"/><text x="105" y="112" font-size="14" font-weight="700" text-anchor="middle" fill="#1c1c1a">Task</text><text x="105" y="134" font-size="12" text-anchor="middle" fill="#1c1c1a">no ground-truth verifier</text>
<rect x="220" y="80" width="150" height="76" rx="8" fill="#ffffff" stroke="#1c1c1a" stroke-width="1.8"/><text x="295" y="112" font-size="14" font-weight="700" text-anchor="middle" fill="#1c1c1a">Executor + H0</text><text x="295" y="134" font-size="12" text-anchor="middle" fill="#1c1c1a">reference run</text>
<rect x="410" y="80" width="150" height="76" rx="8" fill="#ffffff" stroke="#1c1c1a" stroke-width="1.8"/><text x="485" y="112" font-size="14" font-weight="700" text-anchor="middle" fill="#1c1c1a">Editor proposes</text><text x="485" y="134" font-size="12" text-anchor="middle" fill="#1c1c1a">invariant + domain edit</text>
