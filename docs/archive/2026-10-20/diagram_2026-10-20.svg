<text x="480" y="376" font-size="13" font-weight="700" text-anchor="middle" fill="#b4441f">What my version adds</text>
<text x="480" y="396" font-size="12.5" text-anchor="middle" fill="#1c1c1a">There is no verifier anywhere in the loop. Every arrow carries behavioral evidence, not ground truth.</text>
