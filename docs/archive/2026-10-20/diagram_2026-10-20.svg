<rect x="790" y="80" width="150" height="76" rx="8" fill="#ffffff" stroke="#1c1c1a" stroke-width="1.8"/><text x="865" y="112" font-size="14" font-weight="700" text-anchor="middle" fill="#1c1c1a">Composer</text><text x="865" y="134" font-size="12" text-anchor="middle" fill="#1c1c1a">merge, revise or reject</text>
