<svg xmlns="http://www.w3.org/2000/svg" width="900" height="430" viewBox="0 0 900 430" font-family="Helvetica,Arial,sans-serif" font-size="15">
<rect width="900" height="430" fill="#fbfaf7"/>
<text x="450" y="30" text-anchor="middle" font-size="19" font-weight="700" fill="#1c1c1a">DeepInfer-style serving: where the open code stops</text>
<defs><marker id="a" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8z" fill="#1c1c1a"/></marker></defs>
<rect x="20" y="70" width="110" height="60" rx="8" fill="#fff" stroke="#1c1c1a"/><text x="75" y="105" text-anchor="middle">Request</text>
<rect x="170" y="60" width="150" height="80" rx="8" fill="#f3d9cf" stroke="#b4441f" stroke-width="2" stroke-dasharray="6 4"/><text x="245" y="95" text-anchor="middle" font-weight="700">Router</text><text x="245" y="115" text-anchor="middle" font-size="13">prefill: by compute</text><text x="245" y="130" text-anchor="middle" font-size="13">decode: by KV length</text>
<rect x="370" y="60" width="150" height="80" rx="8" fill="#d9ead3" stroke="#2f6b2a" stroke-width="2"/><text x="445" y="95" text-anchor="middle" font-weight="700">Prefill workers</text><text x="445" y="115" text-anchor="middle" font-size="13">compute only the</text><text x="445" y="130" text-anchor="middle" font-size="13">uncached ~4% of input</text>
<rect x="570" y="60" width="150" height="80" rx="8" fill="#d9ead3" stroke="#2f6b2a" stroke-width="2"/><text x="645" y="95" text-anchor="middle" font-weight="700">Decode workers</text><text x="645" y="115" text-anchor="middle" font-size="13">wide expert parallel,</text><text x="645" y="130" text-anchor="middle" font-size="13">speculative decoding</text>
<rect x="760" y="70" width="120" height="60" rx="8" fill="#fff" stroke="#1c1c1a"/><text x="820" y="105" text-anchor="middle">Response</text>
<path d="M130,100 H168" stroke="#1c1c1a" stroke-width="2" marker-end="url(#a)"/><path d="M320,100 H368" stroke="#1c1c1a" stroke-width="2" marker-end="url(#a)"/><path d="M520,100 H568" stroke="#1c1c1a" stroke-width="2" marker-end="url(#a)"/><path d="M720,100 H758" stroke="#1c1c1a" stroke-width="2" marker-end="url(#a)"/>
<rect x="200" y="250" width="500" height="90" rx="8" fill="#f3d9cf" stroke="#b4441f" stroke-width="2" stroke-dasharray="6 4"/><text x="450" y="283" text-anchor="middle" font-weight="700">Shared KV cache store (~100 PiB SSD, 3FS)</text><text x="450" y="305" text-anchor="middle" font-size="13">3 days of agent prefixes, 7 days of chat; any prefill worker can read it</text><text x="450" y="324" text-anchor="middle" font-size="13">NOT in the open release</text>
<path d="M445,140 V248" stroke="#2f6b2a" stroke-width="2" marker-end="url(#a)"/><path d="M470,250 V142" stroke="#2f6b2a" stroke-width="2" marker-end="url(#a)"/>
<text x="425" y="200" text-anchor="end" font-size="13" fill="#2f6b2a">hit: reuse</text><text x="478" y="200" font-size="13" fill="#2f6b2a">miss: write back</text>
<rect x="20" y="380" width="14" height="14" fill="#d9ead3" stroke="#2f6b2a"/><text x="42" y="392" font-size="13">in the open repo (engine)</text>
<rect x="260" y="380" width="14" height="14" fill="#f3d9cf" stroke="#b4441f" stroke-dasharray="3 2"/><text x="282" y="392" font-size="13">not released: router, cache store (per the repo README and AINews)</text>
</svg>
