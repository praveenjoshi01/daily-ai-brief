<svg xmlns="http://www.w3.org/2000/svg" width="900" height="440" viewBox="0 0 900 440" font-family="Helvetica,Arial,sans-serif" font-size="15">
<rect width="900" height="440" fill="#fbfaf7"/>
<text x="450" y="30" text-anchor="middle" font-size="19" font-weight="700" fill="#1c1c1a">Before: handoffs. After: one loop, logic moved into skills and tools</text>
<defs><marker id="a" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8z" fill="#1c1c1a"/></marker></defs>
<text x="20" y="62" font-weight="700" fill="#8a2c10">BEFORE: orchestrated subagents</text>
<rect x="20" y="75" width="120" height="50" rx="8" fill="#fff" stroke="#1c1c1a"/><text x="80" y="105" text-anchor="middle">Router</text>
<rect x="180" y="75" width="120" height="50" rx="8" fill="#fff" stroke="#1c1c1a"/><text x="240" y="105" text-anchor="middle">Planner</text>
<rect x="340" y="75" width="130" height="50" rx="8" fill="#fff" stroke="#1c1c1a"/><text x="405" y="105" text-anchor="middle">Specialist A</text>
<rect x="510" y="75" width="130" height="50" rx="8" fill="#fff" stroke="#1c1c1a"/><text x="575" y="105" text-anchor="middle">Specialist B</text>
<rect x="680" y="75" width="190" height="50" rx="8" fill="#fff" stroke="#1c1c1a"/><text x="775" y="105" text-anchor="middle">Synthesizer</text>
<line x1="140" y1="100" x2="178" y2="100" stroke="#1c1c1a" marker-end="url(#a)"/><line x1="300" y1="100" x2="338" y2="100" stroke="#1c1c1a" marker-end="url(#a)"/><line x1="470" y1="100" x2="508" y2="100" stroke="#1c1c1a" marker-end="url(#a)"/><line x1="640" y1="100" x2="678" y2="100" stroke="#1c1c1a" marker-end="url(#a)"/>
<text x="450" y="150" text-anchor="middle" font-size="13" fill="#8a2c10">each arrow = a summary; detail is lost at every handoff</text>
<text x="20" y="200" font-weight="700" fill="#2f6b2a">AFTER: single loop (my version adds where each old role went)</text>
<rect x="20" y="215" width="400" height="190" rx="10" fill="#fff" stroke="#1c1c1a" stroke-width="2"/>
<text x="220" y="242" text-anchor="middle" font-weight="700">One model, one context window</text>
<text x="220" y="268" text-anchor="middle" font-size="13">turn 1: write plan, revise as results land</text>
<text x="220" y="290" text-anchor="middle" font-size="13">each turn: batch of parallel tool calls</text>
<text x="220" y="312" text-anchor="middle" font-size="13">loop ends on answer or turn/cost budget</text>
<text x="220" y="340" text-anchor="middle" font-size="13">optional verifier check afterwards</text>
<text x="220" y="385" text-anchor="middle" font-size="13" fill="#2f6b2a">evals gate every fold</text>
<rect x="480" y="215" width="390" height="55" rx="8" fill="#d9ead3" stroke="#2f6b2a" stroke-width="2"/><text x="675" y="238" text-anchor="middle" font-weight="700">Skills</text><text x="675" y="257" text-anchor="middle" font-size="13">ordering, domain procedure (old specialists)</text>
<rect x="480" y="283" width="390" height="55" rx="8" fill="#d9ead3" stroke="#2f6b2a" stroke-width="2"/><text x="675" y="306" text-anchor="middle" font-weight="700">Tools (MCP)</text><text x="675" y="325" text-anchor="middle" font-size="13">hard limits, approval gates, permissions, lookups</text>
<rect x="480" y="351" width="390" height="55" rx="8" fill="#fff" stroke="#1c1c1a" stroke-dasharray="5 4"/><text x="675" y="374" text-anchor="middle" font-weight="700">Kept as subagents</text><text x="675" y="393" text-anchor="middle" font-size="13">parallel work, black-box verification</text>
<line x1="420" y1="242" x2="478" y2="242" stroke="#1c1c1a" marker-end="url(#a)"/><line x1="420" y1="310" x2="478" y2="310" stroke="#1c1c1a" marker-end="url(#a)"/><line x1="420" y1="378" x2="478" y2="378" stroke="#1c1c1a" marker-end="url(#a)"/>
</svg>
