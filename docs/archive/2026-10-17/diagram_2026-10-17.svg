<svg xmlns="http://www.w3.org/2000/svg" width="900" height="460" viewBox="0 0 900 460" font-family="Helvetica, Arial, sans-serif">
<rect width="900" height="460" fill="#faf9f5"/>
<defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#444"/></marker></defs>
<text x="450" y="34" text-anchor="middle" font-size="20" font-weight="700" fill="#1c1c1a">Tokens go cheap, dollars go frontier: the routing layer in between</text>
<rect x="30" y="170" width="150" height="80" rx="10" fill="#fff" stroke="#444" stroke-width="2"/>
<text x="105" y="205" text-anchor="middle" font-size="16" font-weight="700">Requests</text>
<text x="105" y="227" text-anchor="middle" font-size="13" fill="#555">from your product</text>
<rect x="250" y="150" width="190" height="120" rx="10" fill="#fff3e8" stroke="#b4441f" stroke-width="3"/>
<text x="345" y="188" text-anchor="middle" font-size="17" font-weight="700" fill="#b4441f">Router / harness</text>
<text x="345" y="212" text-anchor="middle" font-size="13" fill="#555">task type, risk, budget</text>
<text x="345" y="232" text-anchor="middle" font-size="13" fill="#555">avg 15 models per team</text>
<rect x="530" y="70" width="330" height="100" rx="10" fill="#e8f1fb" stroke="#2b6cb0" stroke-width="2"/>
<text x="695" y="102" text-anchor="middle" font-size="16" font-weight="700" fill="#2b6cb0">Cheap open-weight tier</text>
<text x="695" y="126" text-anchor="middle" font-size="14">~71.5% of tokens, ~23% of dollars</text>
<text x="695" y="148" text-anchor="middle" font-size="12" fill="#555">e.g. DeepSeek-v4.1-Flash: ~half of tokens, 2.6% of spend</text>
<rect x="530" y="250" width="330" height="100" rx="10" fill="#f0e8fb" stroke="#6b46c1" stroke-width="2"/>
<text x="695" y="282" text-anchor="middle" font-size="16" font-weight="700" fill="#6b46c1">Frontier / premium tier</text>
<text x="695" y="306" text-anchor="middle" font-size="14">~28.5% of tokens, ~77% of dollars</text>
<text x="695" y="328" text-anchor="middle" font-size="12" fill="#555">(shares derived from the rounded open-weight figures)</text>
<rect x="250" y="370" width="610" height="60" rx="10" fill="#fff" stroke="#b4441f" stroke-width="2" stroke-dasharray="7 5"/>
<text x="555" y="396" text-anchor="middle" font-size="15" font-weight="700" fill="#b4441f">Acceptance check (added in my version)</text>
<text x="555" y="416" text-anchor="middle" font-size="12" fill="#555">cost per accepted result feeds back into routing; Vercel's index does not measure this</text>
<path d="M180 210 H248" stroke="#444" stroke-width="2.5" fill="none" marker-end="url(#a)"/>
<path d="M440 185 L528 125" stroke="#444" stroke-width="2.5" fill="none" marker-end="url(#a)"/>
<path d="M440 235 L528 295" stroke="#444" stroke-width="2.5" fill="none" marker-end="url(#a)"/>
<path d="M695 350 V368" stroke="#b4441f" stroke-width="2" fill="none" marker-end="url(#a)"/>
<path d="M250 400 H215 V270 H215" stroke="#b4441f" stroke-width="2" fill="none" stroke-dasharray="6 4"/>
<path d="M215 270 L300 272" stroke="#b4441f" stroke-width="2" fill="none" stroke-dasharray="6 4" marker-end="url(#a)"/>
</svg>
