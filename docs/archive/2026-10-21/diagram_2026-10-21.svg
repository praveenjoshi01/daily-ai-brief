<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 420" width="960" height="420" font-family="Helvetica, Arial, sans-serif">
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#1c1c1a"/></marker><marker id="o" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#b4441f"/></marker></defs>
<rect width="960" height="420" fill="#f6f5f1"/>
<text x="30" y="34" font-size="19" font-weight="700" fill="#1c1c1a">The skill-judgment loop, and where it goes hollow (my redraw)</text>
<text x="30" y="56" font-size="12" fill="#5d5c57">Top: the healthy loop the paper describes. Bottom (orange): the failure path, with the check the paper's playbook adds.</text>
<g stroke="#1c1c1a" stroke-width="1.8" fill="#fff">
<rect x="30" y="90" width="170" height="80" rx="8"/><rect x="250" y="90" width="170" height="80" rx="8"/><rect x="470" y="90" width="170" height="80" rx="8"/><rect x="690" y="90" width="240" height="80" rx="8"/></g>
<g font-size="14" fill="#1c1c1a" text-anchor="middle" font-weight="700"><text x="115" y="125">Developer delegates</text><text x="335" y="125">Agent produces work</text><text x="555" y="125">Independent check</text><text x="810" y="125">Judgment grows</text></g>
<g font-size="11.5" fill="#5d5c57" text-anchor="middle"><text x="115" y="146">sized to what you</text><text x="115" y="161">can verify</text><text x="335" y="146">skill can exceed</text><text x="335" y="161">its own judgment</text><text x="555" y="146">tests, specs, evals,</text><text x="555" y="161">reviewers</text><text x="810" y="146">codify what "good" is</text><text x="810" y="161">as examples and standards</text></g>
<g stroke="#1c1c1a" stroke-width="1.8" marker-end="url(#a)"><line x1="200" y1="130" x2="248" y2="130"/><line x1="420" y1="130" x2="468" y2="130"/><line x1="640" y1="130" x2="688" y2="130"/></g>
<path d="M810 172 V215 H115 V174" fill="none" stroke="#1c1c1a" stroke-width="1.8" marker-end="url(#a)"/>
<text x="460" y="208" font-size="11.5" fill="#5d5c57" text-anchor="middle">better context, examples and standards for the next delegation</text>
<g stroke="#b4441f" stroke-width="1.8" fill="#fff"><rect x="250" y="270" width="170" height="80" rx="8"/><rect x="470" y="270" width="190" height="80" rx="8"/><rect x="710" y="270" width="220" height="80" rx="8"/></g>
<g font-size="14" fill="#b4441f" text-anchor="middle" font-weight="700"><text x="335" y="305">Agent produces work</text><text x="565" y="305">Approve without checking</text><text x="820" y="305">Hollow orchestrator</text></g>
<g font-size="11.5" fill="#5d5c57" text-anchor="middle"><text x="335" y="326">more volume each month</text><text x="565" y="326">"the agent agreed with itself"</text><text x="820" y="326">responsible for work you</text><text x="820" y="341">can no longer judge</text></g>
<g stroke="#b4441f" stroke-width="1.8" marker-end="url(#o)"><line x1="420" y1="310" x2="468" y2="310"/><line x1="660" y1="310" x2="708" y2="310"/></g>
<text x="30" y="310" font-size="12" fill="#b4441f" font-weight="700">Failure path</text>
<text x="30" y="395" font-size="12" fill="#5d5c57">My version adds the explicit independent check between output and approval, and the feedback arrow; the paper describes both in prose.</text>
</svg>
