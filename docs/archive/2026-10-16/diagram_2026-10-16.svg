<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 430" font-family="Helvetica,Arial,sans-serif" font-size="14">
<rect width="900" height="430" fill="#ffffff"/>
<defs><marker id="a" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8z" fill="#444"/></marker></defs>
<text x="450" y="28" text-anchor="middle" font-size="17" font-weight="bold" fill="#222">Scion fetch path, redrawn: who asks whom, and what is allowed to fail</text>
<g stroke="#444" stroke-width="1.5" fill="none" marker-end="url(#a)">
<path d="M170,130 L260,130"/><path d="M450,130 L540,130"/><path d="M730,130 L720,200" stroke-dasharray="5 4"/>
<path d="M170,300 L260,300"/><path d="M450,300 L540,300"/></g>
<rect x="30" y="95" width="140" height="70" rx="8" fill="#e8f0fe" stroke="#3b6fd4"/><text x="100" y="125" text-anchor="middle">CI job / agent</text><text x="100" y="146" text-anchor="middle" font-size="12">scn client (stateless)</text>
<rect x="260" y="95" width="190" height="70" rx="8" fill="#fff4e0" stroke="#d98a1c"/><text x="355" y="125" text-anchor="middle">scion-daemon (per node)</text><text x="355" y="146" text-anchor="middle" font-size="12">objects shared by all jobs</text>
<rect x="540" y="95" width="190" height="70" rx="8" fill="#fff4e0" stroke="#d98a1c"/><text x="635" y="125" text-anchor="middle">scion-cache (regional)</text><text x="635" y="146" text-anchor="middle" font-size="12">memory-served, &gt;99% hits</text>
<rect x="540" y="200" width="190" height="70" rx="8" fill="#e6f4ea" stroke="#2e8b57"/><text x="635" y="230" text-anchor="middle">scion-server (authority)</text><text x="635" y="251" text-anchor="middle" font-size="12">Spanner + cloud storage</text>
<text x="100" y="205" text-anchor="middle" font-weight="bold" fill="#b4441f">Read path: immutable objects</text>
<text x="100" y="225" text-anchor="middle" font-size="12">request only what you will read;</text>
<text x="100" y="243" text-anchor="middle" font-size="12">any tier can answer; resumable</text>
<rect x="30" y="270" width="140" height="60" rx="8" fill="#e8f0fe" stroke="#3b6fd4"/><text x="100" y="296" text-anchor="middle">Agent edit</text><text x="100" y="315" text-anchor="middle" font-size="12">sends the diff</text>
<rect x="260" y="270" width="190" height="60" rx="8" fill="#f3e8fd" stroke="#8a4bd4"/><text x="355" y="296" text-anchor="middle">Server-side changeset</text><text x="355" y="315" text-anchor="middle" font-size="12">commit/rebase/merge, no push</text>
<rect x="540" y="300" width="190" height="60" rx="8" fill="#f3e8fd" stroke="#8a4bd4"/><text x="635" y="326" text-anchor="middle">Ref = compare-and-swap</text><text x="635" y="345" text-anchor="middle" font-size="12">one row; only main/release</text>
<text x="450" y="400" text-anchor="middle" font-size="13" fill="#555">My additions: the write path (changeset creation is separate from ref update) and the rule that tiers may only talk to the next tier up.</text>
</svg>
